runner:
  class_name: OnPolicyRunner
  num_steps_per_env: 96
  save_interval: 100
  obs_groups: { "actor": ["main"], "critic": ["main"] }
  logger: tensorboard
  neptune_project: legged_gym
  wandb_project: legged_gym
  run_name: ""

  actor:
    class_name: MLPModel
    activation: elu
    obs_normalization: true
    hidden_dims: [512, 256, 128]
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar

  critic:
    class_name: MLPModel
    activation: elu
    obs_normalization: true
    hidden_dims: [512, 256, 128]

  algorithm:
    class_name: PPO
    learning_rate: 0.001
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    value_loss_coef: 1.0
    clip_param: 0.2
    use_clipped_value_loss: true
    desired_kl: 0.02
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0

env:
  class_name: CatbotLegEnv
  robot_description_path: robots/catbot_leg_description/urdf/robot.urdf
  robot_description_type: URDF
  joints:
    a: 0.0
    l: 0.0
  base_init_pos: [0.0, 0.0, 0.0]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length: 20.0
  resampling_time: 4.0
  action_scale: 0.25
  simulate_action_latency: True
  clip_actions: 100.0
  dt: 0.02
  kp: 20.0
  kd: 0.5
  termination_if_pitch_greater_than: 0.7 
  termination_if_roll_greater_than: 0.7

commands:
  vel: [-1.0, 1.0]

obs:
  num_obs:
    main: 13
  scales:
    vel: 1.0
    ang_vel: 1.0
    dof_pos: 1.0
    dof_vel: 0.05

reward:
  tracking_sigma: 0.15
  rewards:
    tracking_vel: 1.0 # 1.0
    lin_vel_z: 0.5 # -1.0
    # roll_angle: 0.0
    # pitch_angle: 0.0
    base_height: -0.1
    action_rate: -0.005 # -0.005
    similar_to_default: -0.01
    energy: 0.0002
    # survival: 0.1
    soft_landing: -0.025
  targets:
    base_height: .3

domain_randomization:
  enabled: false

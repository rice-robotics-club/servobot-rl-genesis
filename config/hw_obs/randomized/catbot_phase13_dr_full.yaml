# yaml-language-server: $schema=../../schemas/config.json
# Phase 12 - Full DR
# Picks up from phase 11. Reward structure tightened slightly.
# Goal: maximum sim-to-real robustness — all ranges pushed to worst-case hardware variance.
# Changes from phase 11:
#   - kp/kd: widened to ±15% / ±30% (worn servos, temperature drift)
#   - friction: widened to ±50% (slippery tile through grippy rubber mat)
#   - mass_shift: widened to ±50g (small payload, dense print fill)
#   - com_shift: added at 2cm std (asymmetric cable routing, assembly variance)
#   - calibration_offset: widened to ±0.2 rad
#   - obs noise: obs dof_vel pushed to worst-case 2.0 rad/s
#   - pushes: stronger (0.5 m/s) and more frequent (every 8s)
#   - stumbles: probability raised to 5%
runner:
  class_name: OnPolicyRunner
  num_steps_per_env: 96
  save_interval: 100
  obs_groups: { "actor": ["main"], "critic": ["main"] }
  logger: tensorboard
  neptune_project: legged_gym
  wandb_project: legged_gym
  run_name: ""

  actor:
    class_name: MLPModel
    activation: elu
    obs_normalization: true
    hidden_dims: [512, 256, 128]
    distribution_cfg:
      class_name: GaussianDistribution
      init_std: 1.0
      std_type: scalar

  critic:
    class_name: MLPModel
    activation: elu
    obs_normalization: true
    hidden_dims: [512, 256, 128]

  algorithm:
    class_name: PPO
    learning_rate: 0.001
    num_learning_epochs: 5
    num_mini_batches: 4
    schedule: adaptive
    value_loss_coef: 1.0
    clip_param: 0.2
    use_clipped_value_loss: true
    desired_kl: 0.02
    entropy_coef: 0.01
    gamma: 0.99
    lam: 0.95
    max_grad_norm: 1.0

env:
  class_name: CatbotHwEnv
  robot_description_path: robots/catbot_description/robot.xml
  robot_description_type: MJCF
  joints:
    BL_a: 0.0
    BL_hip: 0.0
    BL_l: 0.0
    BR_a: 0.0
    BR_hip: 0.0
    BR_l: 0.0
    FL_a: 0.0
    FL_hip: 0.0
    FL_l: 0.0
    FR_a: 0.0
    FR_hip: 0.0
    FR_l: 0.0
  base_init_pos: [0.0, 0.0, 0.4]
  base_init_quat: [1.0, 0.0, 0.0, 0.0]
  episode_length: 20.0
  resampling_time: 4.0
  action_scale: 0.40
  simulate_action_latency: True
  clip_actions: 100.0
  dt: 0.02
  termination_if_pitch_greater_than: 0.7
  termination_if_roll_greater_than: 0.7
  kp: 78.4141526336
  kd: 3.92070763168
  foot_link_names: ["160mm", "160mm_2", "160mm_3", "160mm_4"]
  termination_if_body_contact_height: 0.05

commands:
  lin_vel_x: [-1.0, 1.0]
  lin_vel_y: [-1.5, 1.5]
  ang_vel_z: [-0.1, 0.1]

obs:
  num_obs:
    main: 45
  scales:
    lin_vel_x: 2.0
    lin_vel_y: 2.0
    ang_vel_z: 0.25
    dof_pos: 1.0
    dof_vel: 0.05

reward:
  tracking_sigma: 0.025
  rewards:
    tracking_lin_vel: 200
    tracking_ang_vel: 60
    lin_vel_z: -10
    roll_angle: -200
    pitch_angle: -200
    base_height: -100
    action_rate: -4
    similar_to_default_legs: -0.5
    similar_to_default_hips: -2
    energy: -0.15
    survival: 0.8
    stretching_pain: -3
  targets:
    base_height: 0.25

domain_randomization:
  enabled: true

  imu:
    acc_noise:        [0.05, 0.05, 0.05]
    gyro_noise:       [0.02, 0.02, 0.02]
    acc_random_walk:  [0.001, 0.001, 0.001]
    gyro_random_walk: [0.001, 0.001, 0.001]
    delay: 0.02
    jitter: 0.005

  on_reset:
    kp: [66.6520, 90.1763]       # widened to ±15%
    kd: [2.7445, 5.0969]        # widened to ±30%
    friction: [0.5, 1.5]         # widened to ±50%
    mass_shift: [-0.05, 0.05]    # ±50g per-link manufacturing variance
    body_mass_offset: -1.95      # corrects sim chassis mass to real hardware midpoint (21 lbs total)
    body_mass_shift: [-0.453, 0.453]  # ±1 lb payload uncertainty (20–22 lbs real range)
    com_shift: 0.02              # 2cm std per link — asymmetric cable routing
    calibration_offset: [-0.2, 0.2]  # widened to ±0.2 rad

  obs_noise:
    dof_pos: 0.03                # joint flex under full load
    dof_vel: 2.0                 # worst-case finite-diff velocity at high speed

  pushes:
    enabled: true
    interval_s: 8.0              # more frequent
    max_vel_xy: 0.5              # stronger — a solid shove

  stumbles:
    enabled: true
    probability: 0.05            # raised to 5% — ~1 stumble/s per env
    max_vel_impulse: 2.0         # rad/s — enough to disrupt a swing without launching the leg

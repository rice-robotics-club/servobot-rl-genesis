[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[project]
name = "servobot-rl-genesis"
version = "2026.2.0"
authors = [
  {name = "Justin Lopato", email = "justin@lopato.org"}
]
requires-python = ">=3.12"
dependencies = [
  "torch",
  "numpy",
  "genesis-world",
  "rsl-rl-lib",
  "jsonschema",
  "torchvision",
  "pyyaml",
  "tensorboard",
  "tensordict",
  "pygame",
  "hydra-core>=1.3.2",
  "hydra-auto-schema>=0.0.7",
]

[tool.basedpyright]
include = ["src", "*.py"]
exclude = ["logs", "savedlogs", ".idea", "__pycache__", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "servobot-rl-genesis"
version = "0.1.0"
requires-python = ">= 3.11"
dependencies = [
  "numpy",
  "torch",
  "torchvision",
  "pyyaml",
  "tensorboard",
  "jsonschema",
  "jsonschema-gentypes",
  "tensordict",
  "numpy",
  "pygame",
  "genesis-world @ git+https://github.com/Genesis-Embodied-AI/Genesis.git",
  "rsl-rl-lib==3.3.*",
  "setuptools<78",
]

[project.scripts]
train = "scripts.train:main"
serve = "scripts.serve:main"
update_schema = "scripts.update_schema:main"
evaluate = "scripts.eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "src*"]
